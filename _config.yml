title: Houses of Roman Timgad
tagline: Where work, home, and identity shared a roof.
description: >-
  A public home for the houses of Roman Timgad, an ancient Roman city in modern
  Algeria. An open source digital humanities project cataloging around one
  hundred houses and the lives lived inside them.
author: Kim Edher
email: kimedher@gmail.com
url: "https://timgadhouses.org"
baseurl: ""
github_username: kimedher
lang: en

