{% comment %}
  Arch-of-Trajan motif used as a section divider.
  Refined three-arch form. Strokes inherit currentColor so the color
  is driven by the parent .ornament class.
{% endcomment %}
<div class="ornament" aria-hidden="true">
  <span class="ornament-rule"></span>
  <svg viewBox="0 0 140 56" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- base line -->
    <line x1="4" y1="52" x2="136" y2="52" />
    <!-- entablature (top band) -->
    <line x1="10" y1="20" x2="130" y2="20" />
    <line x1="10" y1="16" x2="130" y2="16" />
    <!-- left smaller arch -->
    <path d="M18 52 L18 32 Q18 26 24 26 Q30 26 30 32 L30 52" />
    <!-- central tall arch -->
    <path d="M52 52 L52 24 Q52 10 70 10 Q88 10 88 24 L88 52" />
    <!-- right smaller arch -->
    <path d="M110 52 L110 32 Q110 26 116 26 Q122 26 122 32 L122 52" />
    <!-- engaged columns between arches -->
    <line x1="40" y1="20" x2="40" y2="52" />
    <line x1="100" y1="20" x2="100" y2="52" />
    <!-- attic crown -->
    <line x1="20" y1="12" x2="120" y2="12" />
    <circle cx="70" cy="4.5" r="1.1" fill="currentColor" stroke="none" />
  </svg>
  <span class="ornament-rule"></span>
</div>
